<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Store</title>

<link rel="stylesheet" href="style.css">

<style>

body{
  margin:0;
  font-family:Arial;
  background:#0d0d0d;
  color:white;
  text-align:center;
  overflow-x:hidden;
}

h1,h2{
  color:white;
}

.ign-box{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:15px;
  margin:20px;
}

.ign-box img{
  width:90px;
  border-radius:10px;
  border:2px solid orange;
}

input{
  padding:12px;
  width:220px;
  border:none;
  border-radius:10px;
}

button{
  padding:12px 25px;
  margin-top:15px;
  border:none;
  border-radius:10px;
  background:orange;
  font-weight:bold;
  cursor:pointer;
}

.cards{
  display:flex;
  justify-content:center;
  gap:20px;
  flex-wrap:wrap;
  margin-top:30px;
}

.card{
  background:#111;
  padding:20px;
  width:200px;
  border-radius:12px;
  border:1px solid orange;
}

.card h2{
  color:orange;
}

#storeContent, #rankSection{
  display:none;
}

</style>

</head>

<body>

<h1>🇪​​🇳​​🇹​​🇪​​🇷​ ​🇾​​🇴​​🇺​​🇷​ ​🇮​​🇳​ ​🇬​​🇦​​🇲​​🇪​ ​🇳​​🇦​​🇲​​🇪​</h1>

<div class="ign-box">

<img id="skinPreview" src="https://mc-heads.net/avatar/Steve/100">

<input id="ignInput" type="text" placeholder="Minecraft IGN" oninput="updateSkin()">

</div>

<button onclick="showStore()">CONTINUE</button>

<!-- STORE -->
<div id="storeContent">

<h2>Categories</h2>

<div class="cards">

<!-- COINS -->
<div class="card">
<h2>Coins</h2>
<a href="mailto:nutsnuts755@gmail.com?subject=Coins Purchase&body=IGN:%0AItem: Coins">
<button>ORDER</button>
</a>
</div>

<!-- LIFESTEAL -->
<div class="card">
<h2>Lifesteal Ranks</h2>
<button onclick="showRanks()">OPEN</button>
</div>

</div>

<!-- RANKS -->
<div id="rankSection">

<h2>Lifesteal Ranks</h2>

<div class="cards">

<div class="card">
<h2>Hero</h2>
<p>₹40 / $0.42</p>
<a href="mailto:nutsnuts755@gmail.com?subject=Hero Rank&body=IGN:%0ARank: Hero">
<button>ORDER</button>
</a>
</div>

<div class="card">
<h2>MVP</h2>
<p>₹80 / $0.83</p>
<a href="mailto:nutsnuts755@gmail.com?subject=MVP Rank&body=IGN:%0ARank: MVP">
<button>ORDER</button>
</a>
</div>

<div class="card">
<h2>Immortal</h2>
<p>₹120 / $1.25</p>
<a href="mailto:nutsnuts755@gmail.com?subject=Immortal Rank&body=IGN:%0ARank: Immortal">
<button>ORDER</button>
</a>
</div>

<div class="card">
<h2>Deadliest</h2>
<p>₹180 / $2.08</p>
<a href="mailto:nutsnuts755@gmail.com?subject=Deadliest Rank&body=IGN:%0ARank: Deadliest">
<button>ORDER</button>
</a>
</div>

<div class="card">
<h2>Legend</h2>
<p>₹240 / $2.78</p>
<a href="mailto:nutsnuts755@gmail.com?subject=Legend Rank&body=IGN:%0ARank: Legend">
<button>ORDER</button>
</a>
</div>

<div class="card">
<h2>Beast</h2>
<p>₹320 / $3.70</p>
<a href="mailto:nutsnuts755@gmail.com?subject=Beast Rank&body=IGN:%0ARank: Beast">
<button>ORDER</button>
</a>
</div>

</div>

</div>

<script>

function updateSkin(){
const ign = document.getElementById("ignInput").value;
document.getElementById("skinPreview").src =
`https://mc-heads.net/avatar/${ign}/100`;
}

function showStore(){
const ign = document.getElementById("ignInput").value;
if(ign.trim()===""){
alert("Enter IGN");
return;
}
document.getElementById("storeContent").style.display="block";
}

function showRanks(){
document.getElementById("rankSection").style.display="block";
}

</script>

</body>
</html>
